schema_version: tie-unused-transport-v1
status: PROOF_ORACLE_ONLY
cases:
  - id: shared_cumulative_knots
    x_scores: [0, 1, 3]
    x_mass: [0.25, 0.50, 0.25]
    y_scores: [0, 2, 3]
    y_mass: [0.25, 0.50, 0.25]
    expected_maximum_product: 3.25
    expected_maximum_covariance: 1.0625
    expected_feature: simultaneous_knots
  - id: unused_middle_x
    x_scores: [0, 1, 2]
    x_mass: [0.50, 0.00, 0.50]
    y_scores: [0, 1, 2]
    y_mass: [0.25, 0.50, 0.25]
    expected_maximum_product: 1.50
    expected_maximum_covariance: 0.50
    expected_feature: zero_mass_category_retained
  - id: nonconsecutive_scores
    x_scores: [0, 2, 5]
    x_mass: [0.25, 0.50, 0.25]
    y_scores: [0, 1, 4]
    y_mass: [0.50, 0.25, 0.25]
    expected_feature: declared_score_gaps
  - id: explicitly_reversed_then_increasing
    x_scores: [0, 1, 2]
    x_mass: [0.20, 0.30, 0.50]
    y_scores: [0, 1, 2]
    y_mass: [0.50, 0.30, 0.20]
    transformation_note: raw labels were explicitly reverse-mapped before this ordered support
    expected_feature: explicit_mapping_not_implicit_reverse
  - id: constant_x
    x_scores: [0, 1, 2]
    x_mass: [0.00, 1.00, 0.00]
    y_scores: [0, 1, 2]
    y_mass: [0.25, 0.50, 0.25]
    expected_maximum_covariance: 0.0
    expected_denominator_status: zero
